<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Mopoishe !!! · bold</title>
  <style>
    /* Reset and base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f5f0e8;  /* soft warm paper-like background */
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 1rem;
    }

    /* main card – fills phone nicely, centered */
    .frame {
      width: 100%;
      max-width: 600px;
      height: 100vh;              /* full viewport height */
      max-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.5rem;
    }

    /* THE TEXT – bold, huge, attractive, responsive */
    .word {
      font-size: clamp(2.8rem, 14vw, 8rem);   /* big on phones, huge on larger screens */
      font-weight: 900;                       /* maximum boldness */
      letter-spacing: -0.02em;                /* tight, modern kerning */
      line-height: 1.15;
      color: #1a1a1a;                         /* deep near-black */
      text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.04), 
                   10px 10px 25px rgba(0, 0, 0, 0.10);
      font-family: 'Inter', 'SF Pro Display', 'Helvetica Neue', 'Arial Black', 
                   system-ui, -apple-system, sans-serif;
      font-style: normal;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transform: scale(1);
      transition: transform 0.15s ease;
      word-break: break-word;
      text-align: center;
      user-select: none;
      padding: 0 0.5rem;
    }

    /* subtle micro-interaction for delight */
    .word:hover {
      transform: scale(1.01);
    }

    /* fallback for very small screens (tight spaces) */
    @media (max-width: 360px) {
      .word {
        font-size: clamp(2rem, 12vw, 4.5rem);
      }
    }

    /* ensure full height on mobile browsers with dynamic bars */
    html, body {
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="frame">
    <h1 class="word">Mopoishe !!!</h1>
  </div>
</body>
</html>
